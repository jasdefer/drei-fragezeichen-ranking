name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "data/prod/polls.tsv"
      - "data/test/polls.tsv"
      - "bot/**"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build production dashboard
        run: python -m bot build-site --output-dir site-prod --ratings-file data/prod/ratings.tsv --polls-file data/prod/polls.tsv --site-variant prod

      - name: Build test dashboard
        run: python -m bot build-site --output-dir site-test --ratings-file data/test/ratings.tsv --polls-file data/test/polls.tsv --site-variant test

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp -R site-prod/. site/
          mkdir -p site/test
          cp -R site-test/. site/test/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
