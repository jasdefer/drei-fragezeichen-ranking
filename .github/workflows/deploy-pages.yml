name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_rankings: ${{ steps.meta.outputs.has_rankings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build visualization site
        run: python -m bot build-site --output-dir site --ratings-file data/prod/ratings.tsv --polls-file data/prod/polls.tsv

      - name: Read build metadata
        id: meta
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          meta = json.loads(Path("site/build_meta.json").read_text(encoding="utf-8"))
          value = "true" if meta.get("has_rankings") else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"has_rankings={value}\n")
          PY

      - name: No rankings yet
        if: steps.meta.outputs.has_rankings != 'true'
        run: echo "Keine Rankings gefunden - Deploy wird uebersprungen."

      - name: Setup Pages
        if: steps.meta.outputs.has_rankings == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.meta.outputs.has_rankings == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_rankings == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
