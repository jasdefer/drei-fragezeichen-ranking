name: Preview Test Site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build test preview site
        run: python -m bot build-site --output-dir site-preview --ratings-file data/test/ratings.tsv --polls-file data/test/polls.tsv --site-variant test

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site-preview
